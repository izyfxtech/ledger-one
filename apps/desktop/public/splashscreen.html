<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LedgerOne</title>
<style>
  /* Standalone page — no Tailwind bundle here on purpose, so the splash
     shows instantly with zero JS/framework boot cost. Colors are hand-
     matched to the light/dark palettes in src/styles.css. */
  :root {
    --paper: oklch(0.985 0.006 85);
    --ink: oklch(0.18 0.015 260);
    --muted: oklch(0.45 0.02 260);
    --rule: oklch(0.18 0.015 260 / 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: oklch(0.16 0.012 260);
      --ink: oklch(0.96 0.006 85);
      --muted: oklch(0.65 0.02 260);
      --rule: oklch(0.96 0.006 85 / 0.12);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 36px 40px;
    border-radius: 16px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule);
    box-shadow: 0 20px 60px -20px rgb(0 0 0 / 0.45);
    animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    animation: pulse 1600ms ease-in-out infinite;
  }
  .name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .tag {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.75; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .mark { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="app-icon.png" alt="" />
    <div class="name">LedgerOne</div>
    <div class="tag">Starting up</div>
  </div>
</body>
</html>
