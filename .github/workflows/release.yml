name: Release Multi-Platform App
on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v, like v1.0.0

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 1. Install PNPM first
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Adjust this if you use a specific major version of pnpm

      # 2. Setup Node and use pnpm caching to make builds faster
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Ubuntu Only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 3. Build using Tauri v2 action
      - name: Build Frontend and Tauri App
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App Release ${{ github.ref_name }}'
          releaseBody: 'Automated release for version ${{ github.ref_name }}'
          releaseDraft: true # Creates a draft release on GitHub for you to review

